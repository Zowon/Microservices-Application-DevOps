apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: microservices-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: microservices.local
    http:
      paths:
      - path: /frontend
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8080
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 5002
      - path: /books
        pathType: Prefix
        backend:
          service:
            name: book-service
            port:
              number: 5003
      - path: /reviews
        pathType: Prefix
        backend:
          service:
            name: review-service
            port:
              number: 5004
      - path: /cart
        pathType: Prefix
        backend:
          service:
            name: cart-service
            port:
              number: 5005
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 5006
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 5007
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 5008
  - host: ""
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8080
