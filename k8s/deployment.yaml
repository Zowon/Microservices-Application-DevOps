apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservices-app
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: AUTH_SERVICE_NAME
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: MYSQL_HOST
---
